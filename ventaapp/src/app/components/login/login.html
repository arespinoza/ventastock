<main class="login-page d-flex align-items-center justify-content-center p-3">
  <section class="card shadow-sm login-card border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock text-primary display-5"></i>
        <h1 class="h3 mt-3 mb-1">Acceso administrador</h1>
        <p class="text-secondary mb-0">Ingresá para gestionar VentaApp</p>
      </div>

      <form (ngSubmit)="ingresar()" #formulario="ngForm">
        <label for="usuario" class="form-label">Usuario</label>
        <input id="usuario" name="usuario" class="form-control mb-3" [(ngModel)]="usuario" required autocomplete="username">

        <label for="clave" class="form-label">Clave</label>
        <input id="clave" name="clave" type="password" class="form-control mb-3" [(ngModel)]="clave" required autocomplete="current-password">

        <div *ngIf="error" class="alert alert-danger py-2" role="alert">{{error}}</div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="formulario.invalid || cargando">
          {{cargando ? 'Ingresando...' : 'Ingresar'}}
        </button>
      </form>
    </div>
  </section>
</main>
