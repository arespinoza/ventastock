<div class="container mt-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a class="text-decoration-none text-reset" style="cursor: pointer;" href="#" (click)="redirigir('home')">Home</a></li>
            <li class="breadcrumb-item"><a class="text-decoration-none text-reset" style="cursor: pointer;" (click)="redirigir('producto-list')">Productos</a></li>
            <li class="breadcrumb-item active" aria-current="page">Formulario</li>
        </ol>
    </nav>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3>Formulario de Producto</h3>
                </div>
                <div class="card-body">
                    <form #productoForm="ngForm">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre del Producto</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Teclado Mecánico RGB" [(ngModel)]="producto.nombre" required>
                                </div>

                                <div class="mb-3">
                                    <span class="form-label d-block">Categorías</span>
                                    <div class="border rounded p-2" *ngIf="categorias.length; else sinCategorias">
                                        <div class="form-check" *ngFor="let categoria of categorias">
                                            <input class="form-check-input" type="checkbox"
                                                [id]="'categoria-' + categoria.id"
                                                [checked]="categoriaIds.includes(categoria.id)"
                                                (change)="alternarCategoria(categoria.id, $event)">
                                            <label class="form-check-label" [for]="'categoria-' + categoria.id">
                                                {{categoria.nombre}}
                                                <small class="text-secondary d-block">{{categoria.descripcion}}</small>
                                            </label>
                                        </div>
                                    </div>
                                    <ng-template #sinCategorias>
                                        <p class="text-secondary mb-0">No hay categorías disponibles.</p>
                                    </ng-template>
                                    <div class="row g-2 mt-2">
                                        <div class="col-md-5">
                                            <input type="text" class="form-control form-control-sm"
                                                name="nuevaCategoriaNombre" placeholder="Nueva categoría"
                                                [(ngModel)]="nuevaCategoria.nombre">
                                        </div>
                                        <div class="col-md-5">
                                            <input type="text" class="form-control form-control-sm"
                                                name="nuevaCategoriaDescripcion" placeholder="Descripción"
                                                [(ngModel)]="nuevaCategoria.descripcion">
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary btn-sm w-100"
                                                (click)="crearCategoria()" [disabled]="!nuevaCategoria.nombre.trim()">
                                                <i class="bi bi-plus-circle"></i> Crear
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4 text-center">
                                <label class="form-label">Foto del producto</label>
                                <div class="border rounded p-2 mb-2" style="min-height: 170px; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
                                    <img *ngIf="producto.foto" [src]="producto.foto" alt="Foto del producto" style="max-width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px;">
                                    <span *ngIf="!producto.foto" class="text-muted">Sin imagen</span>
                                </div>
                                <div class="d-flex gap-2 mt-2 flex-wrap">
                                    <label class="btn btn-outline-primary btn-sm mb-0">
                                        Elegir archivo
                                        <input type="file" accept="image/*" hidden (change)="onFileSelected($event)">
                                    </label>
                                    <label class="btn btn-outline-secondary btn-sm mb-0">
                                        Tomar foto
                                        <input type="file" accept="image/*" capture="environment" hidden (change)="onFileSelected($event)">
                                    </label>
                                </div>
                                <small *ngIf="subiendoImagen" class="text-primary d-block mt-2">Subiendo foto...</small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="preciocompra" class="form-label">Precio Compra</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="preciocompra" name="preciocompra" placeholder="0.00" [(ngModel)]="producto.preciocompra" required min="0">
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="precioventa" class="form-label">Precio Venta</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="precioventa" name="precioventa" placeholder="0.00" [(ngModel)]="producto.precioventa" required min="0">
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" name="stock" placeholder="0" [(ngModel)]="producto.stock" required min="0">
                            </div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" id="estado" name="estado" [(ngModel)]="producto.estado">
                            <label class="form-check-label" for="estado">Estado (Activo / Inactivo)</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-success" (click)="agregarProducto()">
                                <i class="bi bi-plus-circle"></i> Agregar
                            </button>
                            <button type="button" class="btn btn-warning" (click)="modificarProducto()">
                                <i class="bi bi-plus-circle"></i> Modificar
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="salir()">
                                <i class="bi bi-box-arrow-right"></i> Salir
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
