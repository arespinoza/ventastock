<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a class="text-decoration-none text-reset" style="cursor: pointer;" href="#" (click)="redirigir('home')">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Productos</li>
        </ol>
    </nav>
    <h2>Gestión de Productos</h2>
    <div class="mb-3">
        <button class="btn btn-primary" (click)="navigateTo('producto-form/0')">
            <i class="bi bi-plus-circle"></i> Agregar Producto
        </button>
    </div>

    <div class="row g-2 align-items-end mb-3">
        <div class="col-md-6">
            <label for="nombreFiltro" class="form-label visually-hidden">Buscar por nombre</label>
            <div class="input-group">
                <input id="nombreFiltro" type="search" class="form-control bg-light text-dark"
                    [(ngModel)]="nombreFiltro" placeholder="Nombre del producto"
                    (keyup.enter)="filtrarProductos()">
                <button type="button" class="btn btn-secondary" title="Buscar"
                    aria-label="Buscar" (click)="filtrarProductos()">
                    <i class="bi bi-search"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary" title="Limpiar"
                    aria-label="Limpiar" (click)="limpiarFiltro()">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Foto</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Stk</th>
                    <th scope="col">Precio</th>
                    <th scope="col"> </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let producto of productos">
                    <td>
                        <img *ngIf="producto.foto" [src]="producto.foto" alt="Foto del producto" style="width: 55px; height: 55px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">
                        <span *ngIf="!producto.foto" class="text-muted">Sin foto</span>
                        <br><span class="badge bg-warning text-dark">{{producto.categoria}}</span> 
                        <br><span class="badge" [class.bg-primary]="producto.estado" [class.bg-dark]="!producto.estado">
                            {{producto.estado ? 'Vigente' : 'No vigente'}}
                        </span>
                    </td>
                    <td>[{{producto.id}}] {{producto.nombre}}</td>
                    <td>{{producto.stock}}</td>
                    <td>
                        <div class="d-flex flex-column gap-1 small text-nowrap">
                            <span>
                                <span class="text-muted">Compra</span> <br>
                                <strong class="ms-1">{{producto.preciocompra | currency}}</strong>
                            </span>
                            <span>
                                <span class="text-muted">Venta</span> <br>
                                <strong class="ms-1 text-success">{{producto.precioventa | currency}}</strong>
                            </span>
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm" title="Editar"
                            (click)="navigateTo('producto-form/' + producto.id)">
                            <i class="bi bi-pencil-square" type="button"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" title="Eliminar"
                            (click)="deleteProducto(producto.id)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
